# Sandboxed flake check — enforces the invariant that agent-os's property batteries
# pass under a REAL build sandbox, not just a developer's permissive local nix.
#
# WHY: a non-sandboxed `nix flake check` can pass while a *sandboxed* build FAILS — the
# clean-room has no /usr/bin/env, so patchShebangs becomes load-bearing (the cap-battery
# ENOEXEC scar; the Step-7 dispatcher PR did not, as first pushed, actually pass sandbox=true).
# This gate makes every PR prove the sandboxed green that a laptop's non-sandbox check can hide.
#
# SCOPE: builds `checks.x86_64-linux` — the fast property batteries (seconds). It does NOT
# build packages.vm / vm-sealed / test-seal-faildown; those are minutes-long nixosTests kept
# out of `checks` on purpose. That separate slow lane now EXISTS: .github/workflows/vm-tests.yml.
#
# WHAT THIS LANE CANNOT TELL YOU: the egress checks it runs (nft-ruleset-sealed/-unsealed) are
# well-formedness gates — `nft --check` proves a ruleset parses, never that a packet dies. A rule
# weakened to `oifname "wg-mesh" accept` parses fine and goes green here. Green on this workflow
# is NOT evidence that the wall still holds; vm-tests.yml is where that is decided.

name: flake-check (sandboxed)

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the check reads code and writes nothing.
permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned (Fable fold a): immutable commit of the newest v* release tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Nix (flakes + sandbox)
        # SHA-pinned (Fable fold a): DeterminateSystems kept — it marks the runner user
        # trusted, which the sandbox enforcement below actually needs. Pinned to newest v*.
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = true

      # Fail-loud sandbox assert (Fable fold b): a runner/installer change that degrades
      # sandboxing turns THIS step RED instead of quietly hollowing the gate. Belt to the
      # extra-conf + --option suspenders below (defends installer drift, not redundant).
      - name: Assert sandbox is enabled
        run: test "$(nix config show sandbox)" = "true"

      # Cheap (evaluates attribute NAMES, builds nothing) so it runs BEFORE the batteries and
      # fails in seconds. It lives in THIS lane, not vm-tests.yml, on purpose: this workflow has
      # no `paths:` filter, so it runs on every PR and cannot be dodged by a change that happens
      # to touch none of the slow lane's listed paths. A contract about what CI runs should not
      # itself be skippable by a path filter.
      #
      # It asserts that the flake's `test-*` packages and the vm-tests matrix are the same set.
      # vm-tests.yml states that rule twice in prose — "a test that lands without its matrix
      # entry is precisely the failure this whole file was written to end" — and until now it was
      # enforced by whoever remembered. A test package with no matrix entry runs nowhere: the
      # nixosTests are held out of `checks` deliberately, so the fast lane does not build it
      # either, and nothing anywhere goes red.
      # Every locked flake input is nixpkgs — the 2026-07-28 clean-room directive, which until
      # now lived in prose only. modules/clean-room.nix is a *runtime egress* wall and says
      # nothing about where the bytes in the closure came from at BUILD time; one added
      # `inputs.foo.url` would have been fetched, locked and merged with every lane green.
      # Placed BEFORE `nix flake check` deliberately: it is a text check on flake.lock, it takes
      # milliseconds, and if a third-party input has entered the tree, the answer to "should we
      # spend four minutes building it" is no.
      - name: every flake input is nixpkgs (clean-room provenance)
        # Runner python is fine here — stdlib only, no third-party import to go absent. The
        # contract FAILS rather than skips if flake.lock is missing, so there is no silent no-op.
        run: python3 tests/flake-input-provenance-contract.py

      - name: the provenance contract's own control arms actually run
        # Those arms lived in that file's module docstring under the line "Control arms (each MUST
        # fail — if one does not, that check is not a check)". A MUST, in prose, executed by
        # nobody: the contract could have degraded to `return 0` for every input — the single
        # worst failure available to it — and this lane would have stayed green, because the only
        # input it ever ran was the healthy one. Same shape the contract is ABOUT, four lines
        # above the arms it did not run.
        run: ./tests/flake-input-provenance-battery.sh

      - name: front-door kick battery (the wall the 3B exfil case proved)
        # First entry taken OFF known-unwired-debt.txt rather than added to it. Pure decision
        # layer — frontdoor_decide() never executes and do_tool is a recorder — so no ollama and
        # no VM: runner python is enough, and the battery FAILS rather than skips if the brain
        # module is missing.
        run: python3 tests/frontdoor-kick-battery.py

      - name: vm-tests matrix covers every test-* package
        # Run under a nix-provided python rather than the runner image's: if PyYAML were merely
        # assumed present, an image change would turn this check into a no-op or a spurious red.
        run: nix shell nixpkgs#python3Packages.pyyaml --command python3 tests/vm-matrix-contract.py

      # The retry decider's own battery. WIRED HERE DELIBERATELY, in the lane no path filter can
      # skip: a test file that lands unrun is the exact trap tests/vm-matrix-contract.py's debt
      # ledger exists to catch, and this battery's whole subject is a code path that had never
      # executed. Adding it unwired would reproduce the defect it was written about.
      #
      # Pure bash against synthetic logs — no nix, no VM, no network — because the arms that
      # matter (shape A alone; shape A plus a genuine assertion) are cases the real corpus cannot
      # produce on demand.
      - name: flake-retry decider battery
        run: ./tests/flake-retry-decide-battery.sh

      # `--option sandbox true` is the whole point: it reproduces the clean-room build
      # (no /usr/bin/env, patchShebangs load-bearing) that a laptop's non-sandbox check hides.
      # `-L` prints full build logs so a battery failure is legible in the run output.
      - name: nix flake check (sandbox=true)
        run: nix flake check --option sandbox true -L
