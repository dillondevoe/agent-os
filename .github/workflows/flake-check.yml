# Sandboxed flake check — enforces the invariant that agent-os's property batteries
# pass under a REAL build sandbox, not just a developer's permissive local nix.
#
# WHY: a non-sandboxed `nix flake check` can pass while a *sandboxed* build FAILS — the
# clean-room has no /usr/bin/env, so patchShebangs becomes load-bearing (the cap-battery
# ENOEXEC scar; the Step-7 dispatcher PR did not, as first pushed, actually pass sandbox=true).
# This gate makes every PR prove the sandboxed green that a laptop's non-sandbox check can hide.
#
# SCOPE: builds `checks.x86_64-linux` — the fast property batteries (seconds). It does NOT
# build packages.vm / vm-sealed / test-seal-faildown; those are minutes-long nixosTests kept
# out of `checks` on purpose. That separate slow lane now EXISTS: .github/workflows/vm-tests.yml.
#
# WHAT THIS LANE CANNOT TELL YOU: the egress checks it runs (nft-ruleset-sealed/-unsealed) are
# well-formedness gates — `nft --check` proves a ruleset parses, never that a packet dies. A rule
# weakened to `oifname "wg-mesh" accept` parses fine and goes green here. Green on this workflow
# is NOT evidence that the wall still holds; vm-tests.yml is where that is decided.

name: flake-check (sandboxed)

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the check reads code and writes nothing.
permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned (Fable fold a): immutable commit of the newest v* release tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # FULL history, because tests/vm-matrix-contract.py replays two pre-fix shas
          # (be1769b, 53f1b8a) through the live checker as control arms. The default shallow
          # clone does not contain them, and `git fetch --depth=1 origin <sha>` is refused
          # here -- proven, not assumed: run 33970457370 failed with "0 of 2 arms ran under
          # CI". The arm is built so that unreachable == FAILURE rather than skip, which is
          # why this shows up as a red run and not as a green one missing two controls.
          fetch-depth: 0

      - name: Install Nix (flakes + sandbox)
        # SHA-pinned (Fable fold a): DeterminateSystems kept — it marks the runner user
        # trusted, which the sandbox enforcement below actually needs. Pinned to newest v*.
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = true

      # Fail-loud sandbox assert (Fable fold b): a runner/installer change that degrades
      # sandboxing turns THIS step RED instead of quietly hollowing the gate. Belt to the
      # extra-conf + --option suspenders below (defends installer drift, not redundant).
      - name: Assert sandbox is enabled
        run: test "$(nix config show sandbox)" = "true"

      # Cheap (evaluates attribute NAMES, builds nothing) so it runs BEFORE the batteries and
      # fails in seconds. It lives in THIS lane, not vm-tests.yml, on purpose: this workflow has
      # no `paths:` filter, so it runs on every PR and cannot be dodged by a change that happens
      # to touch none of the slow lane's listed paths. A contract about what CI runs should not
      # itself be skippable by a path filter.
      #
      # It asserts that the flake's `test-*` packages and the vm-tests matrix are the same set.
      # vm-tests.yml states that rule twice in prose — "a test that lands without its matrix
      # entry is precisely the failure this whole file was written to end" — and until now it was
      # enforced by whoever remembered. A test package with no matrix entry runs nowhere: the
      # nixosTests are held out of `checks` deliberately, so the fast lane does not build it
      # either, and nothing anywhere goes red.
      # Every locked flake input is nixpkgs — the 2026-07-28 clean-room directive, which until
      # now lived in prose only. modules/clean-room.nix is a *runtime egress* wall and says
      # nothing about where the bytes in the closure came from at BUILD time; one added
      # `inputs.foo.url` would have been fetched, locked and merged with every lane green.
      # Placed BEFORE `nix flake check` deliberately: it is a text check on flake.lock, it takes
      # milliseconds, and if a third-party input has entered the tree, the answer to "should we
      # spend four minutes building it" is no.
      - name: every flake input is nixpkgs (clean-room provenance)
        # Runner python is fine here — stdlib only, no third-party import to go absent. The
        # contract FAILS rather than skips if flake.lock is missing, so there is no silent no-op.
        run: python3 tests/flake-input-provenance-contract.py

      - name: the provenance contract's own control arms actually run
        # Those arms lived in that file's module docstring under the line "Control arms (each MUST
        # fail — if one does not, that check is not a check)". A MUST, in prose, executed by
        # nobody: the contract could have degraded to `return 0` for every input — the single
        # worst failure available to it — and this lane would have stayed green, because the only
        # input it ever ran was the healthy one. Same shape the contract is ABOUT, four lines
        # above the arms it did not run.
        run: ./tests/flake-input-provenance-battery.sh

      - name: front-door kick battery (the wall the 3B exfil case proved)
        # First entry taken OFF known-unwired-debt.txt rather than added to it. Pure decision
        # layer — frontdoor_decide() never executes and do_tool is a recorder — so no ollama and
        # no VM: runner python is enough, and the battery FAILS rather than skips if the brain
        # module is missing.
        run: python3 tests/frontdoor-kick-battery.py

      # Second entry taken OFF tests/known-unwired-debt.txt (12 -> 11). Host-side python; the
      # brain/provider modules are read from the checkout, so no nix and no VM.
      #
      # It exits 1 on a failing arm AND on an absent subject — but by different routes: a named
      # "transport-battery: FAIL" in the first case, a FileNotFoundError traceback in the second.
      # The exit code cannot tell them apart. That is the red-by-crash / red-by-verdict split, and
      # it is why the ledger check is not satisfied by "it goes red".
      - name: transport seam battery
        run: python3 tests/transport-battery.py

      # Third entry taken OFF tests/known-unwired-debt.txt (11 -> 10). Same shape as the step
      # above: host-side python, brain/provider modules read from the checkout, no nix, no VM.
      # Subject absent gives a FileNotFoundError traceback; a broken arm gives a named
      # "anthropic-transport-battery: FAIL". Both are rc=1 and CI cannot tell them apart.
      - name: anthropic transport seam battery
        run: python3 tests/anthropic-transport-battery.py

      # Fourth and fifth entries off tests/known-unwired-debt.txt (10 -> 8). Picked because they
      # are the only two of the remaining ten that do NOT self-disarm; the other eight exit 0
      # when their CLI is absent, so wiring one of those first would buy a meaningless green.
      #
      # audit-signing exercises bin/audit end to end in a scratch dir. Note that with bin/audit
      # ABSENT it still reds, but the traceback points at a missing scratch audit.log rather
      # than at the missing binary — the red is real and its location is misleading.
      - name: audit signing battery
        run: python3 tests/audit-signing-battery.py

      # Host-side python against modules/agent-brain.py; no nix, no VM, no network.
      - name: escalate consent battery
        run: python3 tests/escalate-consent-battery.py

      # THE FIRST SELF-DISARMING BATTERY WIRED, AND BOTH HALVES OF THE GATE ARE HERE.
      # `AGENT_OS_STRICT: "1"` is the caller half: without it this battery announces SKIP and
      # exits 0 when khal is absent, which is the meaningless green the debt ledger's
      # `[self-disarming]` tag was invented to name. `nix shell nixpkgs#khal` is why the
      # variable is honest to set — the step stages the backend it then promises. Removing
      # either line reds tests/vm-matrix-contract.py by name (strict_callers_unarmed for the
      # env, the battery itself for the CLI), which is the only reason this pair can be
      # trusted to stay a pair.
      - name: calendar battery (khal-backed, strict)
        env:
          AGENT_OS_STRICT: "1"
        run: nix shell nixpkgs#khal --command python3 tests/calendar-battery.py

      # THE SECOND SELF-DISARMING BATTERY WIRED, AND THE LAST ONE THAT CAN BE.
      # The other six ledger entries have no second binary at all — `shutil.which("agos-X")`
      # with nothing to fall back to — so strict on them is a guaranteed red outside the
      # image lane. They are blocked on the image, not on this pattern. `agos-calc` was the
      # only remaining battery with calendar's shape, and `nix shell nixpkgs#libqalculate`
      # is what makes AGENT_OS_STRICT honest to set here: the step stages the backend it
      # then promises. Removing either line reds tests/vm-matrix-contract.py by name.
      - name: agos-calc battery (qalc-backed, strict)
        env:
          AGENT_OS_STRICT: "1"
        run: nix shell nixpkgs#libqalculate --command python3 tests/agos-calc-battery.py

      - name: vm-tests matrix covers every test-* package
        # Run under a nix-provided python rather than the runner image's: if PyYAML were merely
        # assumed present, an image change would turn this check into a no-op or a spurious red.
        run: nix shell nixpkgs#python3Packages.pyyaml --command python3 tests/vm-matrix-contract.py

      - name: that contract's checks actually run on the real invocation
        # The step above proves the checker's PREDICATES work; this one proves main() USES them.
        # It copies the tree, plants one fault per arm, and asserts the named diagnostic came back
        # from the process — the only observation a neutered call site cannot satisfy. Same nix
        # python, same reason: the fixture resolves its own packages via nix eval.
        run: nix shell nixpkgs#python3Packages.pyyaml --command python3 tests/vm-matrix-call-site-arms.py

      # The retry decider's own battery. WIRED HERE DELIBERATELY, in the lane no path filter can
      # skip: a test file that lands unrun is the exact trap tests/vm-matrix-contract.py's debt
      # ledger exists to catch, and this battery's whole subject is a code path that had never
      # executed. Adding it unwired would reproduce the defect it was written about.
      #
      # Pure bash against synthetic logs — no nix, no VM, no network — because the arms that
      # matter (shape A alone; shape A plus a genuine assertion) are cases the real corpus cannot
      # produce on demand.
      - name: flake-retry decider battery
        run: ./tests/flake-retry-decide-battery.sh

      # The time-to-connect probe's own battery, wired here for the identical reason as the one
      # above: this lane has no path filter to skip it. The probe runs in vm-tests, but its
      # battery must not — the vm-tests path filter means a change to scripts/vm-connect-probe.sh
      # alone would not trigger that lane, so a battery living there could be edited to green
      # without ever running.
      #
      # Its load-bearing arms are ARM 2 (a zero-connect log must still emit n=0, not silence) and
      # ARMs 7/8 (one connect rendered twice counts once; two real connects of equal duration
      # still count twice). ARM 7 was found on the real corpus AFTER the hand-made fixtures were
      # green — the fixtures omitted a rendering the producer does emit.
      - name: vm-connect probe battery
        run: ./tests/vm-connect-probe-battery.sh

      # `--option sandbox true` is the whole point: it reproduces the clean-room build
      # (no /usr/bin/env, patchShebangs load-bearing) that a laptop's non-sandbox check hides.
      # `-L` prints full build logs so a battery failure is legible in the run output.
      - name: nix flake check (sandbox=true)
        run: nix flake check --option sandbox true -L

  # SEPARATE JOB, and the separation is the point. A failing STEP ends its JOB, so this
  # cosmetic aging check sat immediately ahead of `nix flake check` and DELETED the eval gate:
  # every eval-time assert in the repo — the registry invariants, the runtimePaths negative
  # control, cap-sandbox-check — went unevaluated for ~20h across #259–#265 (2026-09-02/03,
  # 12/12 runs step-skipped) while the checks list showed nothing but a red everyone had already
  # learned to call "known, pin drift". Reordering would have fixed the suppression and kept the
  # worse half: two unrelated verdicts on one check line, so the next drift past 25 re-earns the
  # "known red" label and a REAL eval failure hides behind it. Two jobs means two independently
  # legible verdicts — `flake-check (sandboxed)` means evaluation, `pin-freshness` means aging —
  # and the dismissable label can only ever attach to the one that is actually cosmetic.
  #
  # The script is pure git, so this job needs no Nix install: checkout + fetch + script.
  pin-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA-pinned (Fable fold a): immutable commit of the newest v* release tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The installer's FLAKE_REV must not rot behind main. install.sh pins the flake to a rev
      # so a fresh install builds a KNOWN system rather than whatever main is that second; the
      # cost of that trade is a NEW quiet failure — main advances, nobody bumps, and a fresh
      # install lays down a system that predates every fix since, with nothing erroring anywhere.
      # Rabbot's ruling 2026-08-31: aging must be LOUD, not visible-if-someone-looks.
      #
      # The fetch is explicit rather than relying on the checkout's depth: the default checkout is
      # SHALLOW, so `origin/main` and `git rev-list` silently resolve to nothing, and a check that
      # cannot see the mainline would report on a distance it never measured. `--depth=200` bounds
      # the fetch while still exceeding the 25-commit threshold by a wide margin; if the pin is
      # ever further back than that, the ancestry test fails rather than passing on a truncated
      # history — the empty-result law, applied to git.
      - name: install.sh flake pin is fresh (not rotting behind main)
        run: |
          git fetch --depth=200 origin main
          BASE=FETCH_HEAD ./tests/pin-freshness.sh
