name: personal-data-gate
# Layer 2. The pre-push hook (layer 1) lives in .git/hooks, is not version-controlled,
# and is bypassed by --no-verify or by any clone that never ran install-hooks.sh.
# This job is the one that cannot be skipped from a developer's machine.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: self-test the gate before trusting it
        # A gate whose battery has not run this minute is a claim. If the battery
        # fails, the job fails even when the diff is clean -- a broken instrument
        # returning "no hits" is the failure mode this whole file exists to prevent.
        run: bash tests/personal-data-gate-battery.sh
      - name: scan added lines
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in ''|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1) ;; esac
          ./tools/personal-data-gate.sh "$base..${{ github.sha }}"
      - name: scan HEAD itself against the baseline
        # The step above reads ADDED LINES. Anything already in HEAD was never an added line
        # under this gate's watch, so no amount of diff scanning reaches it -- that set was
        # found by a one-off sweep on 2026-09-02, and a one-off finds a leak once and never
        # notices the next one. This step makes the cleaned state enforceable.
        run: ./tools/personal-data-gate.sh --tree
