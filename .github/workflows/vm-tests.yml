# The SLOW LANE — behavioural VM tests, the ones that prove packets actually die.
#
# WHY THIS EXISTS (2026-08-14). The fast lane (flake-check.yml) builds `checks`, which for the
# egress wall means `nft-ruleset-sealed` / `nft-ruleset-unsealed`. Those are WELL-FORMEDNESS
# gates: they run the module's own lkl-hijacked `nft --check` and prove the ruleset parses. They
# cannot know which packets you meant to drop. A WEAKENED rule parses perfectly — `oifname
# "wg-mesh" accept`, the uid-blind accept of 2fb94c6 that handed the untrusted agent an all-port
# path to every mesh peer, is valid nftables and passed every gate this repo had.
#
# The tests that DO catch it (tests/egress-uid-scope.nix, tests/egress-mesh-uid-scope.nix) were
# written, reviewed, merged — and lived in `packages`, which no scheduled job ever built. For the
# window between writing them and this file, the repo's regression coverage for its most serious
# security bug was a file that ran when a human remembered. A regression test that does not
# execute does not prevent the regression; it documents that someone once could have caught it.
#
# SCOPE: the nixosTests held out of `checks` because they boot VMs (minutes, not seconds).
# `checks` stays fast and runs on every PR; this lane runs on the paths that can move the wall.
# It said "the three" when it was written; the matrix is the authoritative count, and it has grown
# past the egress wall it was built for — WP-S5's allowlist and WP-S2's capability-seam mount
# namespace are here for the same structural reason, which is that a well-formedness gate cannot
# tell a correct-looking property from an effective one.
#
# RESIDUAL, stated rather than implied: the path filter means a PR that widens the wall through a
# file NOT listed below merges without this lane ever running. The nightly cron on main is the
# backstop for exactly that case — but it catches such a change AFTER it has landed, not before.
# Widening the filter is cheap; if you find yourself adding a path that can change what these VMs
# BOOT or what the wall DOES, add it here in the same commit.
#
# That sentence used to read "an egress-relevant path", and the wording was itself the bug: it
# invited the reader to ask "does my change touch egress?" when the question that matters is
# "does my change reach these VMs?". `configuration.nix` is the first entry in baseModules and is
# booted by every test in the matrix, yet it went unlisted here for as long as this file has
# existed — because nobody edits it thinking "egress". A filter is a claim about what is covered,
# and a claim narrower than the thing it guards reads exactly like full coverage.

# OPEN-LANE CONSTRAINT, at the point of use. Before adding an open-lane entry to the matrix
# below: `agentos-open` does NOT build on a runner. modules/model-3b-open.nix pins the 3B
# weights as a fixed-output derivation with no fetcher — its builder prints a
# `nix-store --add-fixed` command and exits 1 — and configuration-open.nix imports it
# unconditionally, so the blob is in the closure of the whole open system. Evaluation passes,
# the build fails; PR #136's first run died there at 2m25s having never booted. Disable the
# seed units in your test node (see tests/selfimprove-loop-runs.nix, DEVIATION 2), and do not
# let the resulting green be read as coverage of the shipped open image. Full write-up in
# README.md; the real fix is task 317.

name: vm-tests (slow lane)

on:
  pull_request:
    paths:
      # Anything that can change what the wall does...
      - 'modules/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      # ...including the two TOP-LEVEL configs. `./configuration.nix` is the FIRST entry in
      # flake.nix's `baseModules`, so it is booted by every VM in the matrix below — it decides
      # what those VMs actually are. Omitting it meant a PR could change the base every slow-lane
      # VM boots and merge with only the fast lane having run. That is not hypothetical: PR #102
      # (2026-08-16) edited configuration.nix and configuration-open.nix, and `gh pr view 102`
      # listed exactly one check, `flake-check`. Found by editing the file and noticing the lane
      # stayed quiet.
      - 'configuration.nix'
      - 'configuration-open.nix'
      # ...and the capability binaries, for the same reason one level down.
      # tests/cap-sandbox-confinement.nix executes `${../bin/cap-invoke}` directly (line 89), and
      # modules/cap-invoke-pkg.nix copies `../bin/<impl>` into the package for every shipped cap
      # (line 134). So bin/ is not adjacent to the slow lane — it is the payload the confinement
      # VM runs. Editing a cap impl changes what test-cap-sandbox-confinement actually exercises.
      #
      # Stated honestly: nothing has slipped through yet. Every historical bin/ change also
      # touched flake.nix, modules/, or tests/ and so triggered this lane anyway — 46a079c
      # (bin/cap-invoke) and d83ed81 (bin/cap-file-read, bin/cap-file-write) both did. That is
      # exactly the problem worth fixing BEFORE it bites: the coverage is real but INCIDENTAL,
      # standing only on the habit of shipping impls alongside their registry and battery. A
      # bin-only change — a shebang fix, a permissions change, a one-line bugfix in an impl —
      # is the normal shape of a follow-up commit, and it would run zero VM tests while altering
      # the binary under confinement. Coverage that depends on a commit's habits is not coverage.
      - 'bin/**'
      # ...and this file itself. A harness excluded from its own trigger set cannot object to
      # being gutted: without this line, a PR deleting the steps below would merge green.
      - '.github/workflows/vm-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'configuration.nix'
      - 'configuration-open.nix'
      - 'bin/**'
      - '.github/workflows/vm-tests.yml'
  schedule:
    # 07:00 UTC daily. Catches drift on main from anything the path filter above missed, and from
    # direct pushes. Nightly, not per-PR, because this lane costs ~10 minutes per test.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: vm-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vm-test:
    runs-on: ubuntu-latest
    # Generous but finite. NOW MEASURED UNDER KVM — first green run of this lane, PR #89 head
    # 7a6fdd7, 2026-08-14: seal-faildown 7.2 min, egress-mesh-uid-scope 5.6, egress-uid-scope 5.1,
    # fetch-proxy-allowlist 3.3 (flake-check, fast lane, 0.9). Worst entry is 7.2 of a 45-minute
    # ceiling, so the ceiling has ~6x headroom and is not the thing to watch.
    #
    # The line this replaces read "~9 min on the dev box under TCG, treat as a conservative CEILING
    # for KVM". Do NOT now read 7.2-vs-9 as a TCG-vs-KVM ratio: different tests on different
    # hardware (i7-8700K dev box vs a GitHub runner), so the comparison is uncontrolled and the
    # "~10x slower under TCG" figure quoted below remains an ASSUMPTION, not a measurement here.
    # It is still the right direction to fail on, which is why the assert stays.
    timeout-minutes: 45
    strategy:
      # Do NOT fail-fast: when the wall breaks, "which of the three legs went red" is the whole
      # diagnostic. One matrix entry per test so each failure is attributable on its own.
      fail-fast: false
      matrix:
        test:
          - test-egress-uid-scope
          - test-egress-mesh-uid-scope
          - test-seal-faildown
          # WP-S5. Added by the PR that introduces tests/fetch-proxy-allowlist.nix, in the same
          # commit as the test — because a test that lands without its matrix entry is precisely
          # the failure this whole file was written to end. It boots TWO nodes (a sealed box and a
          # peer serving :443 and :8443), which I predicted would make it the most expensive entry
          # here. Measured on the first KVM run it was the CHEAPEST at 3.3 min — node count is a
          # poor proxy for wall-clock when the other tests each build a full sealed closure.
          - test-fetch-proxy-allowlist
          # WP-S2 / GATE #5(a). Same rule as the entry above: added in the same commit as
          # tests/cap-sandbox-confinement.nix. Note this lane's SCOPE line says "the three
          # nixosTests held out of `checks`" and describes them as the egress wall — this entry
          # widens it. The wall this one watches is the capability seam's mount namespace, not
          # nftables, but the reason it belongs here is identical: the fast lane can only assert
          # that the derived systemd properties are the intended STRINGS, and a confinement can be
          # cancelled by a property that is present and correct-looking (ProtectSystem=strict does
          # exactly that — see modules/cap-sandbox.nix). Only a booted VM can tell them apart.
          - test-cap-sandbox-confinement
          # WP-S2 / GATE #5(a), the COMPOSED leg. Same rule again: added in the same commit as
          # tests/cap-composed-path.nix. It is the entry that would have caught the hole
          # `checks.cap-wrapper-pinned` was written for — the confinement reaching production
          # through two `export` lines that nothing asserted, where deleting them left every
          # other gate green (the entry above included, because that one supplies the pins as env
          # itself). This is the only scheduled thing that drives the REAL broker wrapper and so
          # the only one that can observe the wiring rather than the mechanism.
          - test-cap-composed-path
          # SURVIVABILITY. Same rule a fourth time: added in the same commit as
          # tests/watchdog-armed.nix. Different subject from every entry above — those watch a
          # wall that keeps something OUT, this watches the mechanism that gets the box BACK.
          # It earns a VM slot rather than a fast-lane check for the reason this file exists:
          # `systemctl show RuntimeWatchdogUSec` reports the configured value whether or not a
          # device was ever opened, so the only assertion that distinguishes "armed" from
          # "configured and inert" is /sys/class/watchdog/watchdog0/state on a booted guest with
          # a real emulated watchdog. Boots one small node with `-device i6300esb`.
          - test-watchdog-armed
          # THE LOOP ITSELF. First entry here that is not a wall and not a recovery mechanism —
          # it watches the agent OS doing its own work. Every HARNESS-MAP row read "BUILT +
          # MERGED + INSTALLED, NEVER RUN", and that was accurate: the self-improvement loop had
          # never executed anywhere, and the open lane had no VM coverage at all (every entry
          # above composes baseModules; the engine ships open-lane only). The existing gates are
          # exactly the well-formedness gates this file's header warns about — they prove the
          # package builds, not that the timer is armed or that a digest lands, and
          # modules/selfimprove-open.nix says so in its own header. Only a booted guest can tell
          # "scheduled" from "installed and inert", which is the same distinction as
          # RuntimeWatchdogUSec vs /sys/class/watchdog/watchdog0/state one entry up. Boots the
          # OPEN image, so it is the heaviest node in this matrix.
          - test-selfimprove-loop-runs
    steps:
      - name: Checkout
        # SHA-pinned, matching flake-check.yml: immutable commit of the newest v* release tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # GitHub's Linux runners ship /dev/kvm, but it is root:kvm 0660 and the runner user is not
      # in the kvm group — so it exists and is unusable, which is the worst of both worlds.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # FAIL LOUD if hardware virtualisation is missing (Fable caution, 2026-08-14). QEMU falls
      # back to TCG *silently* and still passes — it just takes an order of magnitude longer,
      # which turns this lane into the job nobody waits for and eventually the job someone
      # disables. A degraded lane must go RED, not slow.
      - name: Assert KVM is usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is absent. nixosTests would fall back to TCG emulation and" \
                 "this lane would silently become ~10x slower rather than failing. Refusing."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not readable+writable by $(id -un)." \
                 "The udev step above did not take. Same silent-TCG hazard. Refusing."
            exit 1
          fi
          echo "KVM OK: $(ls -l /dev/kvm)"

      # nixosTests build a full system closure per node; the mesh test builds two. Runner images
      # ship ~25GB of toolchains this repo never touches. Precautionary, not measured from a
      # failing run — if a test ever dies on ENOSPC, this is the step to grow.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Install Nix (flakes + sandbox)
        # SHA-pinned, matching flake-check.yml.
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Assert sandbox is enabled
        run: test "$(nix config show sandbox)" = "true"

      # `-L` streams the full VM console + testScript output. When a leg goes red, the subtest
      # name and the assertion message are the report — do not swallow them.
      - name: nix build .#${{ matrix.test }}
        run: nix build --option sandbox true -L --print-build-logs '.#${{ matrix.test }}'
