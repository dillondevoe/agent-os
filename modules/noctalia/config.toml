# Noctalia settings for the Agent OS Hyprland desktop: CachyOS's shipped config (cachyos-hypr-noctalia
# /etc/skel, Noctalia 5.2) with three changes, each because the pin or the wall differs:
#   - no swash (not in nixpkgs): screenshots save to a file and go to the clipboard, no clipboard image action;
#   - polkit_agent = false: an authentication prompt drawn inside the agent's own session is a prompt the
#     agent's processes could imitate (surfaces-and-first-login.md 2.1); admin auth stays off this session;
#   - no greeter_sync block (there is no greeter);
#   - no "kitty" theme template: ~/.config/kitty/kitty.conf is a store symlink the brain window depends on;
#   - no lock / lock-and-suspend: the agent account autologins with no password, so a lock screen could
#     never be unlocked; suspend takes the lock-and-suspend slot.
# Seeded once (tmpfiles C): after first boot this file is the user's, and Noctalia's settings UI owns it.
[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "workspaces", "spacer_1", "active_window" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "launcher", "clock", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[shell]
launch_apps_as_systemd_services = true
polkit_agent = false
settings_show_advanced = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = true
    pipe_to_command = false
    save_to_file = true

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false
